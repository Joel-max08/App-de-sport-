<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Kinetra</title>
<style>
:root{--bg:#111418;--card:#1c2128;--line:#2d333b;--txt:#e6edf3;--mut:#8b949e;--acc:#3fb950;--acc2:#58a6ff;--red:#f85149}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px system-ui,sans-serif;padding-bottom:84px}
header{padding:18px 16px 6px;font-size:22px;font-weight:700}
main{padding:8px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
h3{margin:0 0 10px;font-size:16px}
input,select{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
.row{display:flex;gap:8px;margin:8px 0}
.row>*{flex:1;min-width:0}
button{background:var(--acc);color:#04210c;border:0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:600}
button.sec{background:var(--line);color:var(--txt)}
button.del{background:transparent;color:var(--red);padding:6px 10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#161b22;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 4px;font-size:13px}
nav button.on{color:var(--acc2)}
.set{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.mut{color:var(--mut);font-size:14px}
.timer{font-size:44px;font-weight:700;text-align:center;margin:6px 0}
canvas{width:100%;height:180px}
.hide{display:none}
</style>
</head>
<body>
<header id="title">Séance</header>
<main>

<section id="v-seance">
  <div class="card">
    <h3>Ajouter une série</h3>
    <input id="ex" list="exlist" placeholder="Exercice (ex : Développé couché)">
    <datalist id="exlist"></datalist>
    <div class="row">
      <input id="kg" type="number" inputmode="decimal" placeholder="kg">
      <input id="reps" type="number" inputmode="numeric" placeholder="Reps">
    </div>
    <div class="row"><button onclick="addSet()">+ Ajouter la série</button></div>
    <div class="mut" id="last"></div>
  </div>
  <div class="card">
    <h3>Repos</h3>
    <div class="timer" id="tm">0:00</div>
    <div class="row">
      <button class="sec" onclick="rest(60)">1:00</button>
      <button class="sec" onclick="rest(90)">1:30</button>
      <button class="sec" onclick="rest(120)">2:00</button>
      <button class="sec" onclick="rest(0)">Stop</button>
    </div>
  </div>
  <div class="card"><h3 id="todayT">Aujourd'hui</h3><div id="today"></div></div>
</section>

<section id="v-histo" class="hide">
  <div class="card"><h3>Historique</h3><div id="histo"></div></div>
</section>

<section id="v-prog" class="hide">
  <div class="card">
    <h3>Progression d'un exercice</h3>
    <select id="pex" onchange="drawProg()"></select>
    <canvas id="cv1"></canvas>
    <div class="mut">Charge maximale par séance (kg)</div>
  </div>
  <div class="card">
    <h3>Poids du corps</h3>
    <div class="row">
      <input id="bw" type="number" inputmode="decimal" placeholder="kg">
      <button onclick="addBW()">Ajouter</button>
    </div>
    <canvas id="cv2"></canvas>
  </div>
</section>

<section id="v-repas" class="hide">
  <div class="card">
    <h3>Ajouter un repas</h3>
    <input id="mn" placeholder="Aliment ou repas">
    <div class="row">
      <input id="mk" type="number" inputmode="numeric" placeholder="kcal">
      <input id="mp" type="number" inputmode="numeric" placeholder="Protéines (g)">
    </div>
    <div class="row"><button onclick="addMeal()">+ Ajouter</button></div>
  </div>
  <div class="card"><h3 id="mealT">Aujourd'hui</h3><div id="meals"></div></div>
  <div class="card">
    <h3>Objectifs du jour</h3>
    <div class="row">
      <input id="gk" type="number" inputmode="numeric" placeholder="kcal">
      <input id="gp" type="number" inputmode="numeric" placeholder="Prot. (g)">
    </div>
    <div class="row"><button class="sec" onclick="saveGoals()">Enregistrer</button></div>
  </div>
</section>

<section id="v-data" class="hide">
  <div class="card">
    <h3>Compte</h3>
    <div id="acctBody" class="mut">Chargement…</div>
  </div>
  <div class="card">
    <h3>Mes données</h3>
    <p class="mut">Tout reste sur ton téléphone. Fais une sauvegarde de temps en temps.</p>
    <div class="row"><button onclick="exportData()">Exporter (sauvegarde)</button></div>
    <div class="row"><button class="sec" onclick="document.getElementById('imp').click()">Importer</button></div>
    <input type="file" id="imp" accept="application/json" class="hide" onchange="importData(event)">
  </div>
</section>

</main>
<nav>
  <button data-v="seance" class="on">Séance</button>
  <button data-v="histo">Historique</button>
  <button data-v="prog">Progrès</button>
  <button data-v="repas">Repas</button>
  <button data-v="data">Compte</button>
</nav>

<script>
const KEY='sportapp.v1';
let D;
// MERGE-START
function norm(x){x=x||{};return{sets:x.sets||[],bw:x.bw||[],meals:x.meals||[],goals:x.goals||{k:2200,p:120},goalsT:x.goalsT||0,del:x.del||[]}}
function mergeData(a,b){
  a=norm(a);b=norm(b);
  const del=new Set([...a.del,...b.del]);
  const uni=(x,y)=>{const m=new Map();[...x,...y].forEach(i=>{if(!del.has(i.id))m.set(i.id,i)});return[...m.values()].sort((p,q)=>p.id-q.id)};
  const bw=new Map();[...a.bw,...b.bw].forEach(i=>{const o=bw.get(i.d);if(!o||(i.t||0)>=(o.t||0))bw.set(i.d,i)});
  const g=(b.goalsT||0)>(a.goalsT||0)?b:a;
  return{sets:uni(a.sets,b.sets),meals:uni(a.meals,b.meals),bw:[...bw.values()],goals:g.goals,goalsT:g.goalsT,del:[...del]};
}
// MERGE-END
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
D=norm(D);
const save=()=>{localStorage.setItem(KEY,JSON.stringify(D));if(window.onLocalChange)window.onLocalChange()};
const $=id=>document.getElementById(id);
const day=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=s=>new Date(s+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const titles={seance:'Séance',histo:'Historique',prog:'Progrès',repas:'Repas',data:'Compte'};

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['seance','histo','prog','repas','data'].forEach(v=>$('v-'+v).classList.toggle('hide',v!==b.dataset.v));
  $('title').textContent=titles[b.dataset.v];
  render();
});

function exercises(){return [...new Set(D.sets.map(s=>s.ex))].sort()}
function addSet(){
  const ex=$('ex').value.trim(),kg=parseFloat($('kg').value),reps=parseInt($('reps').value);
  if(!ex||isNaN(kg)||isNaN(reps)){alert('Remplis exercice, kg et reps.');return}
  D.sets.push({id:Date.now(),d:day(),ex,kg,reps});save();$('reps').value='';render();rest(90);
}
function delSet(id){D.sets=D.sets.filter(s=>s.id!==id);D.del.push(id);save();render()}
function lastInfo(){
  const ex=$('ex').value.trim();if(!ex){$('last').textContent='';return}
  const prev=D.sets.filter(s=>s.ex===ex&&s.d!==day()).slice(-1)[0];
  $('last').textContent=prev?`Dernière fois (${fmt(prev.d)}) : ${prev.kg} kg × ${prev.reps}`:'';
}
$('ex').addEventListener('input',lastInfo);

function setRow(s){return `<div class="set"><span><b>${esc(s.ex)}</b><br><span class="mut">${s.kg} kg × ${s.reps}</span></span><button class="del" onclick="delSet(${s.id})">✕</button></div>`}
function renderToday(){
  const t=D.sets.filter(s=>s.d===day());
  $('today').innerHTML=t.length?t.map(setRow).join(''):'<span class="mut">Aucune série pour l\'instant.</span>';
  const vol=t.reduce((a,s)=>a+s.kg*s.reps,0);
  $('todayT').textContent="Aujourd'hui"+(t.length?` · ${t.length} séries · ${Math.round(vol)} kg de volume`:'');
}
function renderHisto(){
  const days=[...new Set(D.sets.map(s=>s.d))].sort().reverse();
  $('histo').innerHTML=days.length?days.map(d=>`<div class="mut" style="margin-top:10px">${fmt(d)}</div>`+D.sets.filter(s=>s.d===d).map(setRow).join('')).join(''):'<span class="mut">Rien pour l\'instant.</span>';
}

// Minuteur
let tInt,tEnd=0;
function rest(sec){
  clearInterval(tInt);
  if(!sec){tEnd=0;$('tm').textContent='0:00';return}
  tEnd=Date.now()+sec*1000;
  const tick=()=>{
    const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
    $('tm').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
    if(left<=0){clearInterval(tInt);if(navigator.vibrate)navigator.vibrate([300,100,300])}
  };
  tick();tInt=setInterval(tick,250);
}

// Graphiques
function line(cv,pts,unit){
  const r=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*r;cv.height=h*r;
  const c=cv.getContext('2d');c.scale(r,r);c.clearRect(0,0,w,h);
  if(pts.length<2){c.fillStyle='#8b949e';c.font='14px system-ui';c.fillText('Pas assez de données (2 points minimum)',10,h/2);return}
  const ys=pts.map(p=>p.y),mn=Math.min(...ys),mx=Math.max(...ys),pad=24,rg=(mx-mn)||1;
  const X=i=>pad+i*(w-2*pad)/(pts.length-1),Y=v=>h-pad-(v-mn)/rg*(h-2*pad);
  c.strokeStyle='#58a6ff';c.lineWidth=2;c.beginPath();
  pts.forEach((p,i)=>i?c.lineTo(X(i),Y(p.y)):c.moveTo(X(i),Y(p.y)));c.stroke();
  c.fillStyle='#3fb950';pts.forEach((p,i)=>{c.beginPath();c.arc(X(i),Y(p.y),3.5,0,7);c.fill()});
  c.fillStyle='#8b949e';c.font='12px system-ui';
  c.fillText(mx+unit,4,12);c.fillText(mn+unit,4,h-4);
  c.fillText(fmt(pts[0].x),pad,h-4);const l=fmt(pts[pts.length-1].x);c.fillText(l,w-pad-c.measureText(l).width,h-4);
}
function drawProg(){
  const ex=$('pex').value;const by={};
  D.sets.filter(s=>s.ex===ex).forEach(s=>by[s.d]=Math.max(by[s.d]||0,s.kg));
  line($('cv1'),Object.keys(by).sort().map(d=>({x:d,y:by[d]})),' kg');
  line($('cv2'),[...D.bw].sort((a,b)=>a.d<b.d?-1:1).map(b=>({x:b.d,y:b.kg})),' kg');
}
function addBW(){const v=parseFloat($('bw').value);if(isNaN(v))return;D.bw=D.bw.filter(b=>b.d!==day());D.bw.push({d:day(),kg:v,t:Date.now()});save();$('bw').value='';drawProg()}

// Repas
function addMeal(){
  const n=$('mn').value.trim(),k=parseInt($('mk').value)||0,p=parseInt($('mp').value)||0;
  if(!n){return}D.meals.push({id:Date.now(),d:day(),n,k,p});save();
  ['mn','mk','mp'].forEach(i=>$(i).value='');renderMeals();
}
function delMeal(id){D.meals=D.meals.filter(m=>m.id!==id);D.del.push(id);save();renderMeals()}
function saveGoals(){D.goals={k:parseInt($('gk').value)||0,p:parseInt($('gp').value)||0};D.goalsT=Date.now();save();renderMeals()}
function renderMeals(){
  const t=D.meals.filter(m=>m.d===day()),K=t.reduce((a,m)=>a+m.k,0),P=t.reduce((a,m)=>a+m.p,0);
  $('mealT').textContent=`Aujourd'hui · ${K}/${D.goals.k} kcal · ${P}/${D.goals.p} g prot.`;
  $('meals').innerHTML=t.length?t.map(m=>`<div class="set"><span><b>${esc(m.n)}</b><br><span class="mut">${m.k} kcal · ${m.p} g prot.</span></span><button class="del" onclick="delMeal(${m.id})">✕</button></div>`).join(''):'<span class="mut">Aucun repas enregistré.</span>';
  $('gk').value=D.goals.k;$('gp').value=D.goals.p;
}

// Données
function exportData(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));
  a.download='sauvegarde-sport-'+day()+'.json';a.click();
}
function importData(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.sets)throw 0;D=norm(x);save();render();alert('Import réussi.')}catch(_){alert('Fichier invalide.')}};
  r.readAsText(f);
}

function render(){
  $('exlist').innerHTML=exercises().map(e=>`<option value="${esc(e)}">`).join('');
  $('pex').innerHTML=exercises().map(e=>`<option>${esc(e)}</option>`).join('');
  renderToday();renderHisto();renderMeals();drawProg();
  if(window.renderAccount)window.renderAccount();
}
render();
window.getData=()=>D;
window.setData=x=>{D=norm(x);localStorage.setItem(KEY,JSON.stringify(D));render()};
window.mergeData=mergeData;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
<script type="module">
const $=id=>document.getElementById(id);
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ERR={
  'auth/invalid-credential':'E-mail ou mot de passe incorrect.',
  'auth/wrong-password':'E-mail ou mot de passe incorrect.',
  'auth/user-not-found':'E-mail ou mot de passe incorrect.',
  'auth/invalid-email':'Adresse e-mail invalide.',
  'auth/missing-email':'Entre ton adresse e-mail.',
  'auth/email-already-in-use':'Un compte existe déjà avec cet e-mail.',
  'auth/weak-password':'Mot de passe trop court (6 caractères minimum).',
  'auth/missing-password':'Entre ton mot de passe.',
  'auth/too-many-requests':"Trop d'essais. Réessaie dans quelques minutes.",
  'auth/network-request-failed':'Pas de connexion internet.',
  'auth/requires-recent-login':'Reconnecte-toi puis réessaie.'
};
const msg=e=>ERR[e.code]||('Erreur : '+(e.code||e.message));
const setMsg=t=>{const m=$('acctMsg');if(m)m.textContent=t};

let mode='none',fb=null,user=null,status='',lastKey='',tmr=null;
try{
  const cfg=(await import('./firebase-config.js')).default;
  if(cfg&&cfg.apiKey&&!String(cfg.apiKey).startsWith('COLLE')){
    mode='offline';
    const B='https://www.gstatic.com/firebasejs/11.0.2/';
    const [A,Au,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=A.initializeApp(cfg);
    fb={Au,F,auth:Au.getAuth(app),db:F.getFirestore(app)};
    mode='ready';
  }
}catch(e){console.warn('Firebase indisponible',e)}

async function sync(){
  if(!fb||!user)return;
  status='Synchronisation…';window.renderAccount();
  try{
    try{await user.reload()}catch(_){}
    const ref=fb.F.doc(fb.db,'users',user.uid);
    const snap=await fb.F.getDoc(ref);
    const local=window.getData();
    const cloud=snap.exists()?snap.data().data:null;
    window.setData(cloud?window.mergeData(local,cloud):local);
    await fb.F.setDoc(ref,{data:JSON.parse(JSON.stringify(window.getData())),updatedAt:fb.F.serverTimestamp()});
    status='Synchronisé à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    console.warn(e);
    status=e.code==='permission-denied'?'Accès refusé : vérifie les règles Firestore.':'Hors ligne : synchronisation plus tard.';
  }
  window.renderAccount();
}

window.onLocalChange=()=>{if(!user)return;clearTimeout(tmr);tmr=setTimeout(sync,1500)};

window.renderAccount=()=>{
  const el=$('acctBody');if(!el)return;
  const key=mode+'|'+(user?user.uid+'|'+user.emailVerified:'')+'|'+status;
  if(key===lastKey)return;lastKey=key;
  if(mode==='none'){el.innerHTML="Les comptes ne sont pas encore activés. L'app fonctionne en mode local : tes données restent sur ce téléphone.";return}
  if(mode==='offline'){el.innerHTML="Service de compte injoignable pour l'instant (hors ligne ?). Tes données locales restent disponibles.";return}
  if(!user){
    el.innerHTML=`<p class="mut" style="margin-top:0">Connecte-toi pour retrouver tes données sur tous tes appareils.</p>
      <input id="aem" type="email" autocomplete="email" placeholder="E-mail">
      <input id="apw" type="password" autocomplete="current-password" placeholder="Mot de passe (6 caractères min.)" style="margin-top:8px">
      <div class="row"><button onclick="acctLogin()">Se connecter</button><button class="sec" onclick="acctSignup()">Créer un compte</button></div>
      <div class="row"><button class="sec" onclick="acctReset()">Mot de passe oublié</button></div>
      <div id="acctMsg" class="mut"></div>`;
    return;
  }
  el.innerHTML=`<p style="margin-top:0">Connecté : <b>${E(user.email)}</b></p>
    ${user.emailVerified?'':'<p class="mut">E-mail non vérifié.</p><div class="row"><button class="sec" onclick="acctVerify()">Renvoyer le mail de vérification</button></div>'}
    <div class="mut">${E(status)}</div>
    <div class="row"><button onclick="acctSync()">Synchroniser maintenant</button></div>
    <div class="row"><button class="sec" onclick="acctLogout()">Se déconnecter</button></div>
    <div class="row"><button class="del" onclick="acctDelete()">Supprimer mon compte</button></div>
    <div id="acctMsg" class="mut"></div>`;
};

window.acctLogin=async()=>{
  const e=$('aem').value.trim(),p=$('apw').value;
  if(!e||!p)return setMsg("Remplis l'e-mail et le mot de passe.");
  setMsg('Connexion…');
  try{await fb.Au.signInWithEmailAndPassword(fb.auth,e,p)}catch(x){setMsg(msg(x))}
};
window.acctSignup=async()=>{
  const e=$('aem').value.trim(),p=$('apw').value;
  if(!e||!p)return setMsg("Remplis l'e-mail et le mot de passe.");
  setMsg('Création du compte…');
  try{
    const c=await fb.Au.createUserWithEmailAndPassword(fb.auth,e,p);
    try{await fb.Au.sendEmailVerification(c.user)}catch(_){}
  }catch(x){setMsg(msg(x))}
};
window.acctReset=async()=>{
  const e=$('aem').value.trim();
  if(!e)return setMsg("Entre ton e-mail ci-dessus d'abord.");
  try{await fb.Au.sendPasswordResetEmail(fb.auth,e);setMsg('Si un compte existe, un mail de réinitialisation vient de partir (regarde aussi les spams).')}catch(x){setMsg(msg(x))}
};
window.acctVerify=async()=>{try{await fb.Au.sendEmailVerification(user);setMsg('Mail envoyé (regarde aussi les spams).')}catch(x){setMsg(msg(x))}};
window.acctSync=sync;
window.acctLogout=()=>fb.Au.signOut(fb.auth);
window.acctDelete=async()=>{
  if(!confirm("Supprimer définitivement ton compte et tes données en ligne ? Les données de ce téléphone sont conservées."))return;
  const pw=prompt('Confirme avec ton mot de passe :');
  if(pw===null)return;
  try{
    await fb.Au.reauthenticateWithCredential(user,fb.Au.EmailAuthProvider.credential(user.email,pw));
    await fb.F.deleteDoc(fb.F.doc(fb.db,'users',user.uid));
    await fb.Au.deleteUser(user);
    localStorage.removeItem('sportapp.uid');
  }catch(x){setMsg(msg(x))}
};

if(mode==='ready'){
  fb.Au.onAuthStateChanged(fb.auth,u=>{
    user=u;status='';
    if(u){
      const last=localStorage.getItem('sportapp.uid');
      if(last&&last!==u.uid)window.setData({});
      localStorage.setItem('sportapp.uid',u.uid);
    }
    window.renderAccount();
    if(u)sync();
  });
  window.addEventListener('online',sync);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
}
window.renderAccount();
</script>
</body>
</html>
